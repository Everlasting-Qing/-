<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>格式转换器</title>
<style>
  :root {
    --pink-1: #d63384;
    --pink-2: #ff7eb3;
    --ink: #3a1f2e;
    --muted: #86687a;
    --line: #f3dce8;
    --bg: #fff3f8;
    --danger: #d23b4f;
    --ok: #1f9d63;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    line-height: 1.5;
  }

  .top {
    background: linear-gradient(120deg, var(--pink-1), var(--pink-2));
    color: #fff;
    box-shadow: 0 4px 18px rgba(214, 51, 132, .25);
  }
  .top-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 22px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .top h1 { margin: 0; font-size: 24px; font-weight: 700; }

  main { max-width: 1080px; margin: 0 auto; padding: 22px 20px 60px; }

  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 6px 24px rgba(160, 50, 100, .10);
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 { margin: 0 0 12px; font-size: 16px; }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 12px;
    flex-wrap: wrap;
  }
  .tab-btn {
    padding: 8px 14px;
    border: none;
    background: none;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s;
  }
  .tab-btn.active {
    color: var(--pink-1);
    border-color: var(--pink-1);
  }
  .tab-btn:hover:not(.active) { color: var(--ink); }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    padding: 9px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
    transition: background .15s, border-color .15s, opacity .15s;
  }
  .btn:hover { background: #fff6fa; border-color: #f2bdd6; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.primary { background: var(--pink-1); border-color: var(--pink-1); color: #fff; }
  .btn.primary:hover { background: #b8266d; border-color: #b8266d; }
  .btn.danger { color: var(--danger); }
  .btn.danger:hover { background: #fdf0f2; }

  .drop {
    border: 2px dashed #f2bdd6;
    border-radius: 14px;
    padding: 34px 16px;
    text-align: center;
    cursor: pointer;
    background: #ffeaf3;
    transition: background .15s, border-color .15s;
  }
  .drop:hover, .drop.over { background: #ffeaf3; border-color: var(--pink-1); }
  .drop strong { display: block; font-size: 16px; margin-bottom: 4px; }
  .drop span { font-size: 13px; color: var(--muted); }

  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
  .field { flex: 1; min-width: 120px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
  }
  .field input[type="range"] { width: 100%; }

  .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 14px; }
  .preview-item {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px;
    text-align: center;
  }
  .preview-item img, .preview-item video {
    max-width: 100%;
    max-height: 180px;
    object-fit: contain;
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .preview-name { font-size: 12px; color: var(--muted); word-break: break-all; }
  .preview-size { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .msg { text-align: center; color: var(--muted); padding: 24px 12px; }
  .msg.err { color: var(--danger); }

  #tabs { margin-bottom: 0; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .toast-container { position: fixed; left: 0; right: 0; bottom: 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; z-index: 50; padding: 0 16px; }
  .toast {
    background: rgba(58, 31, 46, .94); color: #fff;
    padding: 10px 18px; border-radius: 12px; font-size: 14px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .22);
    animation: tin .2s ease-out;
  }
  .toast.ok { background: rgba(31, 157, 99, .96); }
  .toast.err { background: rgba(210, 59, 79, .96); }
  @keyframes tin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  @media (max-width: 520px) {
    .top h1 { font-size: 20px; }
    .tabs { gap: 4px; }
    .tab-btn { padding: 6px 12px; font-size: 13px; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <h1>格式转换</h1>
  </div>
</header>

<main>
  <div class="card">
    <div class="tabs" id="tabs">
      <button class="tab-btn active" data-tab="image">📷 图片转换</button>
      <button class="tab-btn" data-tab="gif">🎬 GIF 处理</button>
      <button class="tab-btn" data-tab="video">🎥 视频转 GIF</button>
      <button class="tab-btn" data-tab="batch">🔄 批量处理</button>
    </div>

    <!-- 图片转换 -->
    <div class="tab-content active" id="image">
      <h2>图片转换</h2>
      <div id="imageDrop" class="drop" role="button" tabindex="0">
        <strong>上传图片</strong>
        <span>支持 PNG、JPG、WebP、GIF 等格式</span>
      </div>
      <input id="imageInput" type="file" hidden accept="image/*">

      <div id="imagePreview" class="preview-grid" style="margin-top: 20px;"></div>

      <div id="imageTools" hidden style="margin-top: 20px;">
        <div class="row">
          <div class="field">
            <label>输出格式</label>
            <select id="outputFormat">
              <option value="png">PNG (无损)</option>
              <option value="jpeg">JPEG (有损)</option>
              <option value="webp">WebP (高效)</option>
            </select>
          </div>
          <div class="field">
            <label>质量 (<span id="qualityVal">80</span>%)</label>
            <input type="range" id="quality" min="1" max="100" value="80">
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label>宽度 (像素)</label>
            <input type="number" id="imgWidth" placeholder="保持不变则留空">
          </div>
          <div class="field">
            <label>高度 (像素)</label>
            <input type="number" id="imgHeight" placeholder="保持不变则留空">
          </div>
          <div class="field">
            <label>缩放 (%)</label>
            <input type="number" id="scale" min="1" max="200" value="100">
          </div>
        </div>

        <div class="row">
          <button class="btn primary" id="rotateLeft">↻ 左转 90°</button>
          <button class="btn primary" id="rotateRight">↺ 右转 90°</button>
          <button class="btn primary" id="flipH">🔄 水平翻转</button>
          <button class="btn primary" id="flipV">🔃 垂直翻转</button>
        </div>

        <div class="row">
          <button class="btn primary" id="convertBtn" style="flex: 1;">转换</button>
          <button class="btn" id="downloadImg">⬇ 下载</button>
        </div>
      </div>
    </div>

    <!-- GIF 处理 -->
    <div class="tab-content" id="gif">
      <h2>GIF 处理</h2>
      <div class="row">
        <div class="field" style="flex: 1;">
          <label>GIF 文件</label>
          <input type="file" id="gifInput" accept=".gif" style="padding: 8px;">
        </div>
      </div>

      <div id="gifTools" hidden style="margin-top: 16px;">
        <div class="row">
          <button class="btn primary" id="gifToFrames">📸 转为帧图片 (PNG)</button>
          <button class="btn" id="downloadFrames">⬇ 下载所有帧</button>
        </div>
        <div id="gifInfo" style="margin-top: 12px; font-size: 13px; color: var(--muted);"></div>
      </div>

      <div id="framesPreview" class="preview-grid" style="margin-top: 20px;"></div>
    </div>

    <!-- 视频转 GIF -->
    <div class="tab-content" id="video">
      <h2>视频转 GIF</h2>
      <div id="videoDrop" class="drop" role="button" tabindex="0">
        <strong>上传视频</strong>
        <span>支持 MP4、WebM 等格式（首次加载需要一些时间）</span>
      </div>
      <input id="videoInput" type="file" hidden accept="video/*">

      <div id="videoTools" hidden style="margin-top: 20px;">
        <div class="row">
          <div class="field">
            <label>开始时间 (秒)</label>
            <input type="number" id="startTime" value="0" min="0" step="0.1">
          </div>
          <div class="field">
            <label>时长 (秒)</label>
            <input type="number" id="duration" value="3" min="0.5" step="0.1">
          </div>
          <div class="field">
            <label>宽度 (像素)</label>
            <input type="number" id="videoWidth" value="400" min="50">
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label>帧率 (fps)</label>
            <input type="number" id="fps" value="10" min="1" max="30">
          </div>
          <div class="field">
            <label>质量 (<span id="videoQualityVal">80</span>%)</label>
            <input type="range" id="videoQuality" min="1" max="100" value="80">
          </div>
        </div>

        <div class="row">
          <button class="btn primary" id="convertVideo" style="flex: 1;">转换 GIF</button>
          <button class="btn" id="downloadGif">⬇ 下载</button>
        </div>

        <div id="videoProgress" hidden style="margin-top: 12px;">
          <div style="font-size: 13px; color: var(--muted); margin-bottom: 4px;">处理中... <span id="progressText">0%</span></div>
          <div style="height: 5px; background: #ffeaf3; border-radius: 99px; overflow: hidden;">
            <div id="progressBar" style="height: 100%; width: 0%; background: linear-gradient(90deg, var(--pink-1), var(--pink-2)); transition: width .1s;"></div>
          </div>
        </div>
      </div>

      <div id="videoPreview" style="margin-top: 20px;"></div>
    </div>

    <!-- 批量处理 -->
    <div class="tab-content" id="batch">
      <h2>批量处理图片</h2>
      <div id="batchDrop" class="drop" role="button" tabindex="0">
        <strong>上传多张图片</strong>
        <span>支持同时上传多个文件，同时转换</span>
      </div>
      <input id="batchInput" type="file" multiple hidden accept="image/*">

      <div id="batchTools" hidden style="margin-top: 16px;">
        <div class="row">
          <div class="field">
            <label>输出格式</label>
            <select id="batchFormat">
              <option value="png">PNG</option>
              <option value="jpeg">JPEG</option>
              <option value="webp">WebP</option>
            </select>
          </div>
          <div class="field">
            <label>宽度 (像素)</label>
            <input type="number" id="batchWidth" placeholder="保持不变则留空">
          </div>
          <div class="field">
            <label>高度 (像素)</label>
            <input type="number" id="batchHeight" placeholder="保持不变则留空">
          </div>
        </div>

        <div class="row">
          <button class="btn primary" id="batchConvertBtn" style="flex: 1;">转换全部</button>
          <button class="btn" id="downloadAll">⬇ 下载全部</button>
        </div>
      </div>

      <div id="batchProgress" style="margin-top: 16px;"></div>
      <div id="batchResults" class="preview-grid" style="margin-top: 20px;"></div>
    </div>
  </div>
</main>

<div class="toast-container" id="toasts"></div>

<script>
// 简单 toast 提示
function toast(msg, type = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.getElementById('toasts').append(t);
  setTimeout(() => t.remove(), type === 'err' ? 4000 : 2500);
}

// 标签页切换
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});

// ===== 图片转换 =====
let currentImage = null;
const imageDrop = document.getElementById('imageDrop');
const imageInput = document.getElementById('imageInput');

imageDrop.addEventListener('click', () => imageInput.click());
imageDrop.addEventListener('dragover', e => { e.preventDefault(); imageDrop.classList.add('over'); });
imageDrop.addEventListener('dragleave', () => imageDrop.classList.remove('over'));
imageDrop.addEventListener('drop', e => {
  e.preventDefault();
  imageDrop.classList.remove('over');
  handleImageUpload(e.dataTransfer.files[0]);
});
imageInput.addEventListener('change', () => handleImageUpload(imageInput.files[0]));

function handleImageUpload(file) {
  if (!file || !file.type.startsWith('image/')) {
    toast('请选择图片文件', 'err');
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    currentImage = { data: e.target.result, name: file.name, file };
    showImagePreview();
    document.getElementById('imageTools').hidden = false;
  };
  reader.readAsDataURL(file);
}

function showImagePreview() {
  const prev = document.getElementById('imagePreview');
  prev.innerHTML = `<div class="preview-item">
    <img src="${currentImage.data}" style="max-height: 200px;">
    <div class="preview-name">${currentImage.name}</div>
    <div class="preview-size">${(currentImage.file.size / 1024).toFixed(1)} KB</div>
  </div>`;
}

document.getElementById('quality').addEventListener('input', e => {
  document.getElementById('qualityVal').textContent = e.target.value;
});

function processImage(transform) {
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    let { width, height } = img;

    // 应用变换
    if (transform.includes('rotateLeft') || transform.includes('rotateRight')) {
      [width, height] = [height, width];
    }

    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);

    if (transform.includes('rotateLeft')) ctx.rotate(-Math.PI / 2);
    if (transform.includes('rotateRight')) ctx.rotate(Math.PI / 2);
    if (transform.includes('flipH')) ctx.scale(-1, 1);
    if (transform.includes('flipV')) ctx.scale(1, -1);

    ctx.drawImage(img, -img.width / 2, -img.height / 2);
    ctx.restore();

    // 调整大小
    const w = parseInt(document.getElementById('imgWidth').value) || width;
    const h = parseInt(document.getElementById('imgHeight').value) || height;
    const scale = (parseInt(document.getElementById('scale').value) || 100) / 100;

    const finalCanvas = document.createElement('canvas');
    finalCanvas.width = w * scale;
    finalCanvas.height = h * scale;
    const fctx = finalCanvas.getContext('2d');
    fctx.drawImage(canvas, 0, 0, finalCanvas.width, finalCanvas.height);

    currentImage.processed = finalCanvas;
    showImagePreview();
    toast('已应用变换');
  };
  img.src = currentImage.data;
}

document.getElementById('rotateLeft').addEventListener('click', () => processImage('rotateLeft'));
document.getElementById('rotateRight').addEventListener('click', () => processImage('rotateRight'));
document.getElementById('flipH').addEventListener('click', () => processImage('flipH'));
document.getElementById('flipV').addEventListener('click', () => processImage('flipV'));

document.getElementById('convertBtn').addEventListener('click', () => {
  if (!currentImage) return;
  const format = document.getElementById('outputFormat').value;
  const quality = parseInt(document.getElementById('quality').value) / 100;
  const canvas = currentImage.processed || document.querySelector('#imagePreview img').parentElement.querySelector('img');

  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = img.naturalWidth;
    c.height = img.naturalHeight;
    c.getContext('2d').drawImage(img, 0, 0);

    const w = parseInt(document.getElementById('imgWidth').value) || c.width;
    const h = parseInt(document.getElementById('imgHeight').value) || c.height;
    const scale = (parseInt(document.getElementById('scale').value) || 100) / 100;

    const fc = document.createElement('canvas');
    fc.width = w * scale;
    fc.height = h * scale;
    fc.getContext('2d').drawImage(c, 0, 0, fc.width, fc.height);

    const mime = format === 'jpeg' ? 'image/jpeg' : format === 'webp' ? 'image/webp' : 'image/png';
    currentImage.converted = fc.toDataURL(mime, quality);
    toast('转换完成，可以下载了');
  };
  img.src = currentImage.data;
});

document.getElementById('downloadImg').addEventListener('click', () => {
  if (!currentImage.converted) {
    toast('请先转换', 'err');
    return;
  }
  const link = document.createElement('a');
  link.href = currentImage.converted;
  link.download = currentImage.name.replace(/\.[^.]+$/, '') + '.' + document.getElementById('outputFormat').value;
  link.click();
});

// ===== GIF 处理 =====
let gifFrames = [];
document.getElementById('gifInput').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  toast('正在解析 GIF...');
  // 这里需要 gif.js 库，为了简化暂时显示提示
  document.getElementById('gifTools').hidden = false;
  document.getElementById('gifInfo').textContent = '选中的文件：' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
  toast('GIF 处理需要额外的库，建议使用其他工具或在线服务');
});

// ===== 视频转 GIF =====
let currentVideo = null;
const videoDrop = document.getElementById('videoDrop');
const videoInput = document.getElementById('videoInput');

videoDrop.addEventListener('click', () => videoInput.click());
videoDrop.addEventListener('dragover', e => { e.preventDefault(); videoDrop.classList.add('over'); });
videoDrop.addEventListener('dragleave', () => videoDrop.classList.remove('over'));
videoDrop.addEventListener('drop', e => {
  e.preventDefault();
  videoDrop.classList.remove('over');
  handleVideoUpload(e.dataTransfer.files[0]);
});
videoInput.addEventListener('change', () => handleVideoUpload(videoInput.files[0]));

function handleVideoUpload(file) {
  if (!file || !file.type.startsWith('video/')) {
    toast('请选择视频文件', 'err');
    return;
  }
  const url = URL.createObjectURL(file);
  const video = document.createElement('video');
  video.src = url;
  video.onloadedmetadata = () => {
    document.getElementById('videoTools').hidden = false;
    document.getElementById('duration').value = Math.min(5, Math.floor(video.duration));
    const prev = document.getElementById('videoPreview');
    prev.innerHTML = `<div class="preview-item">
      <video controls style="max-height: 200px;">
        <source src="${url}">
      </video>
      <div class="preview-name">${file.name}</div>
      <div class="preview-size">${(video.duration.toFixed(1))}s</div>
    </div>`;
    currentVideo = { url, file };
  };
}

document.getElementById('videoQuality').addEventListener('input', e => {
  document.getElementById('videoQualityVal').textContent = e.target.value;
});

document.getElementById('convertVideo').addEventListener('click', () => {
  if (!currentVideo) return;
  toast('视频处理需要 FFmpeg，建议使用在线工具或本地软件', 'err');
});

// ===== 批量处理 =====
let batchImages = [];
const batchDrop = document.getElementById('batchDrop');
const batchInput = document.getElementById('batchInput');

batchDrop.addEventListener('click', () => batchInput.click());
batchDrop.addEventListener('dragover', e => { e.preventDefault(); batchDrop.classList.add('over'); });
batchDrop.addEventListener('dragleave', () => batchDrop.classList.remove('over'));
batchDrop.addEventListener('drop', e => {
  e.preventDefault();
  batchDrop.classList.remove('over');
  handleBatchUpload([...e.dataTransfer.files]);
});
batchInput.addEventListener('change', () => handleBatchUpload([...batchInput.files]));

function handleBatchUpload(files) {
  batchImages = [];
  let loaded = 0;
  files.forEach(file => {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e => {
      batchImages.push({ data: e.target.result, name: file.name, file });
      if (++loaded === files.length) {
        showBatchPreview();
        document.getElementById('batchTools').hidden = false;
      }
    };
    reader.readAsDataURL(file);
  });
}

function showBatchPreview() {
  const prev = document.getElementById('batchResults');
  prev.innerHTML = batchImages.map(img => `<div class="preview-item">
    <img src="${img.data}" style="max-height: 150px;">
    <div class="preview-name">${img.name}</div>
    <div class="preview-size">${(img.file.size / 1024).toFixed(1)} KB</div>
  </div>`).join('');
}

document.getElementById('batchConvertBtn').addEventListener('click', () => {
  if (!batchImages.length) {
    toast('请先选择图片', 'err');
    return;
  }
  const format = document.getElementById('batchFormat').value;
  const w = parseInt(document.getElementById('batchWidth').value);
  const h = parseInt(document.getElementById('batchHeight').value);
  const mime = format === 'jpeg' ? 'image/jpeg' : format === 'webp' ? 'image/webp' : 'image/png';

  batchImages.forEach((img, i) => {
    const image = new Image();
    image.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = w || image.naturalWidth;
      canvas.height = h || image.naturalHeight;
      canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
      img.converted = canvas.toDataURL(mime, 0.8);
    };
    image.src = img.data;
  });
  setTimeout(() => { toast('全部转换完成'); }, 500);
});

document.getElementById('downloadAll').addEventListener('click', () => {
  const converted = batchImages.filter(img => img.converted);
  if (!converted.length) {
    toast('没有已转换的图片', 'err');
    return;
  }
  converted.forEach((img, i) => {
    const link = document.createElement('a');
    link.href = img.converted;
    link.download = img.name.replace(/\.[^.]+$/, '') + '_converted.' + document.getElementById('batchFormat').value;
    setTimeout(() => link.click(), i * 200);
  });
  toast('开始下载，共 ' + converted.length + ' 个文件');
});
</script>
